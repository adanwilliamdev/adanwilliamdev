<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-label="Adan William: Backend que não cai em produção. Desenvolvedor Java Júnior.">
<style>
text{font-family:Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}

.cyc{opacity:0;animation:cyc 12s infinite}
.c1{animation-delay:3s}.c2{animation-delay:6s}.c3{animation-delay:9s}
@keyframes cyc{0%{opacity:0;transform:translateY(6px)}4%,22%{opacity:1;transform:none}27%,100%{opacity:0}}
.sweep{stroke-dasharray:90 310;animation:sweep 3.4s linear infinite}
@keyframes sweep{from{stroke-dashoffset:90}to{stroke-dashoffset:-310}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.c0{opacity:1!important}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

<rect x=".5" y=".5" width="999" height="589" rx="28" fill="#0B1120" stroke="#233152"/>
<text x="56" y="132" font-size="62" font-weight="800" letter-spacing="-2" fill="#EEF2FA" textLength="533" lengthAdjust="spacingAndGlyphs">Backend que não</text>
<text x="56" y="198" font-size="62" font-weight="800" letter-spacing="-2" fill="#EEF2FA" textLength="529" lengthAdjust="spacingAndGlyphs">cai em produção.</text>
<circle class="pulse" cx="63" cy="264" r="5" fill="#3DDC97"/><circle cx="63" cy="264" r="5" fill="#3DDC97"/>
<text class="cyc c0" x="84" y="271" font-size="22" font-weight="600" fill="#EEF2FA">Spring Boot e PostgreSQL</text><text class="cyc c1" x="84" y="271" font-size="22" font-weight="600" fill="#EEF2FA">APIs seguras e consistentes</text><text class="cyc c2" x="84" y="271" font-size="22" font-weight="600" fill="#EEF2FA">Docker, Testcontainers e CI/CD</text><text class="cyc c3" x="84" y="271" font-size="22" font-weight="600" fill="#EEF2FA">SLA e disponibilidade</text>
<text x="56" y="318" font-size="17" fill="#93A1C0">Sou <tspan fill="#EEF2FA" font-weight="600">Adan</tspan> <tspan fill="#EEF2FA" font-weight="600">William</tspan>. Passei mais de 5 anos em infraestrutura</text><text x="56" y="346" font-size="17" fill="#93A1C0">crítica de provedores de Internet (N2/N3) e hoje construo</text><text x="56" y="374" font-size="17" fill="#93A1C0">APIs e sistemas completos com <tspan fill="#EEF2FA" font-weight="600">Java</tspan> <tspan fill="#EEF2FA" font-weight="600">/</tspan> <tspan fill="#EEF2FA" font-weight="600">Spring</tspan> <tspan fill="#EEF2FA" font-weight="600">Boot</tspan>,</text><text x="56" y="402" font-size="17" fill="#93A1C0"><tspan fill="#EEF2FA" font-weight="600">PostgreSQL</tspan> e <tspan fill="#EEF2FA" font-weight="600">Docker</tspan>, com foco em regras de negócio,</text><text x="56" y="430" font-size="17" fill="#93A1C0">segurança e consistência de dados, levando para o código a</text><text x="56" y="458" font-size="17" fill="#93A1C0">visão de <tspan fill="#EEF2FA" font-weight="600">disponibilidade</tspan> <tspan fill="#EEF2FA" font-weight="600">e</tspan> <tspan fill="#EEF2FA" font-weight="600">SLA</tspan> da operação.</text>
<text x="56" y="530" font-size="36" font-weight="800" letter-spacing="-1" fill="#EEF2FA">5+</text><text x="56" y="555" font-size="13" fill="#62708F">anos em infra e NOC</text><text x="234.65703125000002" y="530" font-size="36" font-weight="800" letter-spacing="-1" fill="#EEF2FA">12,5k+</text><text x="234.65703125000002" y="555" font-size="13" fill="#62708F">clientes monitorados</text><text x="410.2336328125" y="530" font-size="36" font-weight="800" letter-spacing="-1" fill="#EEF2FA">11</text><text x="410.2336328125" y="555" font-size="13" fill="#62708F">projetos no GitHub</text>
<rect x="616" y="40" width="328" height="510" rx="22" fill="#111A2E" stroke="#233152"/>
<circle class="pulse" cx="654" cy="84" r="5" fill="#3DDC97"/><circle cx="654" cy="84" r="5" fill="#3DDC97"/>
<text x="672" y="89" font-size="17" font-weight="700" fill="#EEF2FA">Disponível para vagas</text>
<text x="652" y="116" font-size="14" fill="#93A1C0">Java Júnior / Full Stack Júnior</text>
<g transform="translate(632 140)">
  <path d="M0 40H46l8-10 8 10H92l8-34 12 62 10-46 8 18H196l8-8 8 8H296" fill="none" stroke="#233152" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="400"/>
  <path class="sweep" d="M0 40H46l8-10 8 10H92l8-34 12 62 10-46 8 18H196l8-8 8 8H296" fill="none" stroke="#3DDC97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" pathLength="400"/>
</g>
<line x1="652" y1="270" x2="908" y2="270" stroke="#233152"/><text x="652" y="296" font-size="13" fill="#62708F">Backend</text><text x="652" y="320" font-size="15" font-weight="600" fill="#EEF2FA">Java · Spring Boot · JPA</text><line x1="652" y1="338" x2="908" y2="338" stroke="#233152"/><text x="652" y="364" font-size="13" fill="#62708F">Dados e infra</text><text x="652" y="388" font-size="15" font-weight="600" fill="#EEF2FA">PostgreSQL · Redis · Docker</text><line x1="652" y1="406" x2="908" y2="406" stroke="#233152"/><text x="652" y="432" font-size="13" fill="#62708F">Também uso</text><text x="652" y="456" font-size="15" font-weight="600" fill="#EEF2FA">Python · React · TypeScript</text><line x1="652" y1="474" x2="908" y2="474" stroke="#233152"/><text x="652" y="500" font-size="13" fill="#62708F">Vim de</text><text x="652" y="524" font-size="15" font-weight="600" fill="#EEF2FA">ISP · NOC · Zabbix · PRTG · Linux</text>

</svg>