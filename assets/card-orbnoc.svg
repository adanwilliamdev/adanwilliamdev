<rect x="28" y="104" width="38" height="3" rx="1.5" fill="url(#m)"/>
<text x="28" y="148" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#B4BEC8">Monitoramento de rede em tempo real, nascido da minha rotina</text>
<text x="28" y="170" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#B4BEC8">de NOC.</text>
<text x="28" y="202" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#2ED5A0">▸</text>
<text x="48" y="202" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8B97A3">ICMP e TCP: o host só fica offline após N falhas seguidas,</text>
<text x="48" y="223" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8B97A3">sem falsos alarmes</text>
<text x="28" y="251" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#2ED5A0">▸</text>
<text x="48" y="251" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8B97A3">Painel, mapa e wallboard para TVs de NOC atualizados via</text>
<text x="48" y="272" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8B97A3">WebSocket</text>
<text x="28" y="300" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#2ED5A0">▸</text>
<text x="48" y="300" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8B97A3">Alertas de queda, recuperação e SLA, com Telegram opcional</text>
<text x="28" y="328" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#2ED5A0">▸</text>
<text x="48" y="328" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8B97A3">Relatórios de SLA (24h, 7d, 30d) em CSV e Excel;</text>
<text x="48" y="349" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8B97A3">diagnóstico com ping, traceroute, DNS e portas</text>
<text x="28" y="377" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#2ED5A0">▸</text>
<text x="48" y="377" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8B97A3">Argon2, JWT em cookie httpOnly + SameSite, CSRF por origem</text>
<text x="48" y="398" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8B97A3">e comandos sem shell</text>
