<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 503" width="500" height="503" role="img" aria-label="OrbNOC: Monitoramento de rede em tempo real, nascido da minha rotina de NOC.">
<style>
text{font-family:Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="8.5" y=".5" width="491" height="494" rx="20" fill="#111A2E" stroke="#233152"/><text x="32" y="52" font-size="24" font-weight="800" letter-spacing="-.5" fill="#EEF2FA">OrbNOC</text><circle cx="464" cy="44" r="15" fill="none" stroke="#233152"/><path d="M456.5 50.500 469.5 37.500M460 37.500h9.500V47" fill="none" stroke="#93A1C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="84" font-size="14.5" fill="#C5CEE3">Monitoramento de rede em tempo real, nascido da minha</text><text x="32" y="105" font-size="14.5" fill="#C5CEE3">rotina de NOC.</text><circle cx="36" cy="138" r="2.5" fill="#3DDC97"/><text x="48" y="143" font-size="14" fill="#93A1C0">ICMP e TCP: o host só fica offline após N falhas seguidas,</text><text x="48" y="163" font-size="14" fill="#93A1C0">sem falsos alarmes</text><circle cx="36" cy="188" r="2.5" fill="#3DDC97"/><text x="48" y="193" font-size="14" fill="#93A1C0">Painel, mapa e wallboard para TVs de NOC atualizados</text><text x="48" y="213" font-size="14" fill="#93A1C0">via WebSocket</text><circle cx="36" cy="238" r="2.5" fill="#3DDC97"/><text x="48" y="243" font-size="14" fill="#93A1C0">Alertas de queda, recuperação e SLA, com Telegram</text><text x="48" y="263" font-size="14" fill="#93A1C0">opcional</text><circle cx="36" cy="288" r="2.5" fill="#3DDC97"/><text x="48" y="293" font-size="14" fill="#93A1C0">Relatórios de SLA (24h, 7d, 30d) em CSV e Excel;</text><text x="48" y="313" font-size="14" fill="#93A1C0">diagnóstico com ping, traceroute, DNS e portas</text><circle cx="36" cy="338" r="2.5" fill="#3DDC97"/><text x="48" y="343" font-size="14" fill="#93A1C0">Argon2, JWT em cookie httpOnly + SameSite, CSRF por</text><text x="48" y="363" font-size="14" fill="#93A1C0">origem e comandos sem shell</text><rect x="32" y="398" width="75" height="30" rx="15" fill="#18233F"/><text x="69.4" y="418" text-anchor="middle" font-size="13" font-weight="500" fill="#A9BEFF">Java 21</text><rect x="114.7226171875" y="398" width="99" height="30" rx="15" fill="#18233F"/><text x="164.1" y="418" text-anchor="middle" font-size="13" font-weight="500" fill="#A9BEFF">Spring Boot</text><rect x="221.41574218750003" y="398" width="91" height="30" rx="15" fill="#18233F"/><text x="266.9" y="418" text-anchor="middle" font-size="13" font-weight="500" fill="#A9BEFF">Thymeleaf</text><rect x="320.355546875" y="398" width="102" height="30" rx="15" fill="#18233F"/><text x="371.2" y="418" text-anchor="middle" font-size="13" font-weight="500" fill="#A9BEFF">PostgreSQL</text><rect x="32" y="436" width="97" height="30" rx="15" fill="#18233F"/><text x="80.4" y="456" text-anchor="middle" font-size="13" font-weight="500" fill="#A9BEFF">WebSocket</text><rect x="136.879140625" y="436" width="101" height="30" rx="15" fill="#18233F"/><text x="187.4" y="456" text-anchor="middle" font-size="13" font-weight="500" fill="#A9BEFF">Apache POI</text><rect x="245.8919921875" y="436" width="70" height="30" rx="15" fill="#18233F"/><text x="280.9" y="456" text-anchor="middle" font-size="13" font-weight="500" fill="#A9BEFF">Docker</text>
</svg>