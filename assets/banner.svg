<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Adan William, Desenvolvedor Java" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#140808"/>
      <stop offset="1" stop-color="#2A0A0A"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1E1E"/>
      <stop offset="0.55" stop-color="#FF4D4D"/>
      <stop offset="1" stop-color="#FF8A5C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FF1E1E" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FF1E1E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF1E1E" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      .mono { font-family: 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace; }
      .sans { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .line { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.9); opacity: .15; } }
      .blink { animation: blink 1.2s steps(2,start) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .cyc { opacity: 0; animation: cyc 12s infinite; }
      .c2 { animation-delay: 3s; } .c3 { animation-delay: 6s; } .c4 { animation-delay: 9s; }
      @keyframes cyc { 0% {opacity:0; transform: translateY(6px);} 3%,22% {opacity:1; transform: translateY(0);} 25%,100% {opacity:0;} }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(340px); } }
      .fadein { animation: fadein 1.2s ease-out both; }
      @keyframes fadein { from { opacity:0; transform: translateX(-16px);} to { opacity:1; transform:none;} }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#FF1E1E" opacity="0.18"/>

  <!-- status chip -->
  <g class="mono">
    <rect x="60" y="36" width="168" height="28" rx="14" fill="#FF1E1E" fill-opacity="0.08" stroke="#FF1E1E" stroke-opacity="0.45"/>
    <circle class="blink" cx="80" cy="50" r="5" fill="#F5F5F5"/>
    <text x="96" y="55" font-size="13" fill="#FFB3B3">STATUS: ONLINE</text>
  </g>

  <!-- title -->
  <g class="fadein">
    <text class="sans" x="58" y="148" font-size="76" font-weight="800" fill="url(#g)" letter-spacing="-1">Adan William</text>
    <text class="sans" x="60" y="184" font-size="22" font-weight="500" fill="#C9D1D9" letter-spacing="3">JAVA  ·  SPRING BOOT  ·  POSTGRESQL  ·  DOCKER</text>
  </g>

  <!-- cycling terminal line -->
  <g class="mono" font-size="19">
    <text x="60" y="238" fill="#F5F5F5">adan@noc</text>
    <text x="146" y="238" fill="#6E7681">:~$</text>
    <text class="cyc c1" x="192" y="238" fill="#E6EDF3">./desenvolvedor-java-junior</text>
    <text class="cyc c2" x="192" y="238" fill="#E6EDF3">./5-anos-de-NOC --alta-disponibilidade</text>
    <text class="cyc c3" x="192" y="238" fill="#E6EDF3">./seguranca --jwt --csrf --testcontainers</text>
    <text class="cyc c4" x="192" y="238" fill="#E6EDF3">docker compose up  # um comando, tudo no ar</text>
    <rect class="blink" x="60" y="262" width="11" height="22" fill="#FF1E1E"/>
  </g>

  <!-- network graph -->
  <g transform="translate(0,0)">
    <g fill="none" stroke="url(#g)" stroke-width="2" stroke-opacity="0.85">
      <path id="p1" class="line" d="M900 160 L1010 80"/>
      <path id="p2" class="line" d="M900 160 L1010 240"/>
      <path id="p3" class="line" d="M1010 80 L1120 150"/>
      <path id="p4" class="line" d="M1010 240 L1120 150"/>
      <path id="p5" class="line" d="M1010 80 L1010 240"/>
      <path id="p6" class="line" d="M900 160 L800 70"/>
      <path id="p7" class="line" d="M900 160 L790 255"/>
      <path id="p8" class="line" d="M1120 150 L1170 60"/>
    </g>
    <!-- packets -->
    <circle r="3.5" fill="#fff"><animateMotion dur="2.2s" repeatCount="indefinite" path="M900 160 L1010 80 L1120 150"/></circle>
    <circle r="3.5" fill="#fff"><animateMotion dur="2.8s" begin="0.6s" repeatCount="indefinite" path="M1120 150 L1010 240 L900 160"/></circle>
    <circle r="3.5" fill="#FF6B35"><animateMotion dur="3.2s" begin="0.3s" repeatCount="indefinite" path="M800 70 L900 160 L790 255"/></circle>

    <!-- nodes -->
    <g>
      <circle class="pulse" cx="900" cy="160" r="12" fill="#FF1E1E"/>
      <circle cx="900" cy="160" r="9" fill="#FF1E1E"/>
      <circle class="pulse" cx="1010" cy="80" r="9" fill="#C1121F" style="animation-delay:.4s"/>
      <circle cx="1010" cy="80" r="7" fill="#C1121F"/>
      <circle class="pulse" cx="1010" cy="240" r="9" fill="#C1121F" style="animation-delay:.8s"/>
      <circle cx="1010" cy="240" r="7" fill="#C1121F"/>
      <circle class="pulse" cx="1120" cy="150" r="11" fill="#FF6B35" style="animation-delay:1.2s"/>
      <circle cx="1120" cy="150" r="8" fill="#FF6B35"/>
      <circle cx="800" cy="70" r="6" fill="#F5F5F5"/>
      <circle cx="790" cy="255" r="6" fill="#F5F5F5"/>
      <circle cx="1170" cy="60" r="5" fill="#F5F5F5"/>
    </g>
    <g class="mono" font-size="11" fill="#9A9A9A">
      <text x="866" y="190">API</text>
      <text x="990" y="64">DB</text>
      <text x="988" y="266">REDIS</text>
      <text x="1098" y="178">DOCKER</text>
    </g>
  </g>
</svg>
