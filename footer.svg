<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="Aberto a oportunidades" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { fill:#4ade80; font-size:17px; }
    .cmd { fill:#e5e7eb; font-size:17px; }
    .out { fill:#38bdf8; font-size:17px; }
    .dim { fill:#9ca3af; font-size:14px; }
    .cursor { fill:#38bdf8; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
  </style>
  <rect x="1" y="1" width="898" height="108" rx="12" fill="#0b0f14" stroke="#1f2937" stroke-width="2"/>
  <text x="36" y="42" class="mono prompt">$</text>
  <text x="54" y="42" class="mono cmd">status --open-to-work</text>
  <text x="36" y="70" class="mono out">disponível para oportunidades como desenvolvedor backend Python / full stack</text>
  <text x="36" y="92" class="mono dim">Python · FastAPI · Next.js · PostgreSQL · Redis</text>
  <rect x="440" y="80" width="10" height="3" class="cursor"/>
</svg>
