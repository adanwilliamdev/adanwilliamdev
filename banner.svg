<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="Adan William, backend que não cai em produção. Python e FastAPI." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2a33" stroke-width="1" opacity="0.45"/>
    </pattern>
    <clipPath id="typeclip"><rect class="typebox" x="62" y="262" width="0" height="34"/></clipPath>
  </defs>
  <style>
    .sans { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .fade { animation: fade .7s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
    .typebox { animation: type 7s steps(16, end) infinite; }
    .tcursor { animation: curs 7s steps(16, end) infinite, blink 1s steps(1) infinite; }
    @keyframes type { 0% { width: 0; } 55% { width: 215px; } 92% { width: 215px; } 100% { width: 0; } }
    @keyframes curs { 0% { transform: translateX(0); } 55% { transform: translateX(213px); } 92% { transform: translateX(213px); } 100% { transform: translateX(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>

  <rect x="1" y="1" width="998" height="538" rx="18" fill="#05080c" stroke="#1a232b" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="538" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="538" rx="18" fill="url(#glow)"/>

  <!-- marca -->
  <circle cx="46" cy="42" r="5" fill="#34d399"/>
  <text x="62" y="47" class="mono" font-size="15" fill="#e5e7eb" font-weight="600">adan <tspan fill="#4b5563">.</tspan> william</text>

  <!-- pill -->
  <rect x="40" y="86" width="262" height="32" rx="16" fill="#0a1016" stroke="#1f2933"/>
  <circle class="pulse" cx="59" cy="102" r="4.5" fill="#34d399"/>
  <text x="74" y="106" class="mono" font-size="12.5" fill="#9ca3af">disponível para novos projetos</text>

  <!-- headline -->
  <text x="38" y="190" class="sans" font-size="56" font-weight="800" letter-spacing="-2" fill="#f3f4f6">Backend que <tspan fill="#a7f3d0">não</tspan></text>
  <text x="38" y="252" class="sans" font-size="56" font-weight="800" letter-spacing="-2" fill="#f3f4f6"><tspan fill="#34d399">cai</tspan> em produção.</text>

  <!-- typing -->
  <text x="40" y="285" class="mono" font-size="22" fill="#4b5563">&gt;</text>
  <g clip-path="url(#typeclip)">
    <text x="62" y="285" class="mono" font-size="22" fill="#34d399">Python &amp; FastAPI</text>
  </g>
  <rect class="tcursor" x="62" y="268" width="2" height="22" fill="#34d399"/>

  <!-- paragrafo -->
  <text class="sans" font-size="15" fill="#9ca3af">
    <tspan x="40" y="330">Sou <tspan fill="#f3f4f6" font-weight="600">Adan William</tspan>. Depois de 5+ anos garantindo alta</tspan>
    <tspan x="40" y="354">disponibilidade em ambientes críticos de ISP, migrei para o</tspan>
    <tspan x="40" y="378">desenvolvimento: APIs assíncronas com <tspan fill="#f3f4f6" font-weight="600">Python / FastAPI</tspan> e</tspan>
    <tspan x="40" y="402">interfaces com <tspan fill="#f3f4f6" font-weight="600">Next.js / TypeScript</tspan>, sempre com a mentalidade</tspan>
    <tspan x="40" y="426">de <tspan fill="#f3f4f6" font-weight="600">observabilidade</tspan> da infra.</tspan>
  </text>

  <!-- stats -->
  <g class="sans">
    <text x="40" y="488" font-size="30" font-weight="800" fill="#f3f4f6">5+</text>
    <text x="40" y="510" class="mono" font-size="11" fill="#6b7280">anos em infra &amp; NOC</text>
    <text x="215" y="488" font-size="30" font-weight="800" fill="#f3f4f6">12k+</text>
    <text x="215" y="510" class="mono" font-size="11" fill="#6b7280">assinantes monitorados</text>
    <text x="420" y="488" font-size="30" font-weight="800" fill="#f3f4f6">11</text>
    <text x="420" y="510" class="mono" font-size="11" fill="#6b7280">projetos no GitHub</text>
  </g>

  <!-- terminal -->
  <rect x="610" y="150" width="352" height="318" rx="14" fill="#0b1118" stroke="#1f2933" stroke-width="1.5"/>
  <path d="M610 190H962" stroke="#1f2933"/>
  <circle cx="632" cy="170" r="5" fill="#2b3440"/>
  <circle cx="650" cy="170" r="5" fill="#2b3440"/>
  <circle cx="668" cy="170" r="5" fill="#2b3440"/>
  <text x="690" y="174" class="mono" font-size="11" fill="#6b7280">~/adan</text>

  <g class="mono" font-size="12.5">
    <g class="fade" style="animation-delay:.2s">
      <text x="630" y="224" fill="#34d399">$</text><text x="646" y="224" fill="#f3f4f6" font-weight="600">whoami</text>
      <text x="630" y="250" fill="#9ca3af">adan-william · backend dev</text>
    </g>
    <g class="fade" style="animation-delay:.6s">
      <text x="630" y="284" fill="#34d399">$</text><text x="646" y="284" fill="#f3f4f6" font-weight="600">stack --now</text>
      <text x="630" y="310" fill="#9ca3af">python · fastapi · next.js · typescript</text>
      <text x="630" y="330" fill="#9ca3af">postgres · redis · docker</text>
    </g>
    <g class="fade" style="animation-delay:1s">
      <text x="630" y="364" fill="#34d399">$</text><text x="646" y="364" fill="#f3f4f6" font-weight="600">background</text>
      <text x="630" y="390" fill="#9ca3af">isp · noc · zabbix · prtg · linux</text>
    </g>
    <g class="fade" style="animation-delay:1.4s">
      <text x="630" y="424" fill="#34d399">$</text><text x="646" y="424" fill="#f3f4f6" font-weight="600">status</text>
      <circle class="pulse" cx="635" cy="445" r="4" fill="#34d399"/>
      <text x="646" y="449" fill="#9ca3af">aberto a oportunidades</text>
    </g>
  </g>
</svg>
