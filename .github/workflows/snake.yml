name: Gerar Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#F2461E&color_dots=#E9ECFA,#BCC6FF,#8294FF,#4A5FFF,#1F36F5
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F2461E&color_dots=#1A1F3D,#4A4412,#8F7C10,#D4B015,#FFD21F

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
