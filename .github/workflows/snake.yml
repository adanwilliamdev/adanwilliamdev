name: Gerar Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF4B1F&color_dots=#E6DDCA,#FFC9B8,#FF9E80,#FF724A,#E63A0F
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF4B1F&color_dots=#2A2622,#5C2A1B,#9A3A20,#E2441D,#FF6A3D

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
