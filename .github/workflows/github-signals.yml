name: Update Live GitHub Signals

on:
  schedule:
    # 4x por dia: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate-github-signals.js"
      - ".github/workflows/github-signals.yml"

permissions:
  contents: write

jobs:
  update-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate GitHub Signals card
        env:
          GITHUB_USERNAME: adanwilliamdev
          GH_TOKEN: ${{ secrets.GH_SIGNALS_TOKEN }}
        run: node scripts/generate-github-signals.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-signals.svg
          git diff --staged --quiet || git commit -m "chore: update live GitHub signals card"
          git push
