name: Update Profile Card

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate-profile-card.js"
      - ".github/workflows/github-signals.yml"

permissions:
  contents: write

concurrency:
  group: profile-card-update
  cancel-in-progress: false

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Profile Card
        env:
          GITHUB_USERNAME: adanwilliamdev
          GH_TOKEN: ${{ secrets.GH_SIGNALS_TOKEN }}
        run: node scripts/generate-profile-card.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/profile-card.svg

          if git diff --staged --quiet; then
            echo "Nada mudou, pulando commit."
            exit 0
          fi

          git commit -m "chore: update profile card"

          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rejeitado, tentando rebase (tentativa $attempt)..."
            git fetch origin main
            git rebase -X ours origin/main
            sleep 3
          done
          exit 1
