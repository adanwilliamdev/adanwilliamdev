<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Adan William, Backend Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .dim { fill: #6b7280; font-size: 14px; }
    .prompt { fill: #4ade80; font-size: 18px; }
    .cmd { fill: #e5e7eb; font-size: 18px; }
    .name { fill: #ffffff; font-size: 38px; font-weight: 700; }
    .role { fill: #38bdf8; font-size: 20px; }
    .stack { fill: #9ca3af; font-size: 15px; }
    .cursor { fill: #38bdf8; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect x="1" y="1" width="898" height="258" rx="12" fill="#0b0f14" stroke="#1f2937" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="38" rx="12" fill="#111827"/>
  <rect x="1" y="26" width="898" height="13" fill="#111827"/>
  <circle cx="24" cy="20" r="6" fill="#374151"/>
  <circle cx="44" cy="20" r="6" fill="#374151"/>
  <circle cx="64" cy="20" r="6" fill="#374151"/>
  <text x="450" y="25" text-anchor="middle" class="mono dim">adan@dev: ~</text>

  <text x="36" y="86" class="mono prompt">$</text>
  <text x="58" y="86" class="mono cmd">whoami</text>

  <text x="36" y="136" class="mono name">Adan William</text>
  <text x="36" y="170" class="mono role">Backend Developer</text>
  <text x="36" y="202" class="mono stack">Python · FastAPI · TypeScript · PostgreSQL · Redis</text>
  <text x="36" y="226" class="mono stack">5+ anos em infraestrutura e NOC, agora construindo software.</text>
  <rect x="36" y="238" width="10" height="3" class="cursor"/>
</svg>
